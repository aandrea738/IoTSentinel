<section class="panel alert-panel">
  <div class="panel-header">
    <h2 style="margin: 0;">ALLARMI</h2>
  </div>

  <div class="alert-list">
    @for (a of allarmi(); track a.id; let idx = $index) {
      <article [style.animation-delay]="(idx * 0.05) + 's'">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="badge" [ngClass]="statusClass(a.gravita)">{{ a.gravita }}</span>
          <span class="timestamp">{{ formatTime(a.timestampInizio) }}</span>
        </div>
        <p class="description">{{ a.descrizione }}</p>
      </article>
    } @empty {
      <p style="text-align: center; color: var(--muted); font-size: 12px; padding: 12px;">NESSUN ALLARME</p>
    }
  </div>
</section>
