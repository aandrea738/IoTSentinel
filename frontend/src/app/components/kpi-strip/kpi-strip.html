<section class="kpi-grid" aria-label="Key Indicators">
  <article class="kpi">
    <span class="label">Sensori Attivi</span>
    <strong class="value">{{ sensoriAttivi() }}</strong>
  </article>
  <article class="kpi">
    <span class="label">Gravità Alta</span>
    <strong class="value high">{{ allarmiAlta() }}</strong>
  </article>
  <article class="kpi">
    <span class="label">Gravità Media</span>
    <strong class="value medium">{{ allarmiMedia() }}</strong>
  </article>
  <article class="kpi">
    <span class="label">Gravità Bassa</span>
    <strong class="value low">{{ allarmiBassa() }}</strong>
  </article>
  <article class="kpi">
    <span class="label">Ultimo Dato</span>
    <strong class="value mono">{{ ultimoAggiornamento() }}</strong>
  </article>
</section>
