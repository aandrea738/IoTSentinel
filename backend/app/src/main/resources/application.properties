quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, origin
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.port=8080

quarkus.datasource.username=sentinel_user
quarkus.datasource.password=password_super_sicura
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/iotsentinel_db
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.generation=update

# Configurazione DAO Sensore: può essere "sql" oppure "memory"
iotsentinel.dao.sensore.strategy=sql

iotsentinel.simulatore.ingestione-url=http://localhost:8080/ingestione
